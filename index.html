<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formation Entretien Ménager</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f0f2f5; }
.header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 20px; text-align: center; }
.container { max-width: 1200px; margin: 20px auto; display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 0 20px; }
.sidebar { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
.sidebar h2 { color: #333; margin-bottom: 15px; }
.video-item { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; border-radius: 5px; }
.video-item:hover { background: #f5f5f5; }
.video-item.active { background: #667eea; color: white; }
.main { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
video { width: 100%; border-radius: 8px; background: #000; }
.video-info { margin-top: 20px; }
.video-info h2 { color: #333; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="header">
<h1>🧹 Formation Entretien Ménager</h1>
</div>
<div class="container">
<aside class="sidebar">
<h2>📚 Modules</h2>
<div class="video-item active">1. Video de prueba</div>
</aside>
<main class="main">
<video id="player" controls autoplay>
<source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
Tu navegador no soporta videos HTML5.
</video>
<div class="video-info">
<h2>Video de prueba</h2>
<p>Si ves este video, ¡la plataforma funciona!</p>
</div>
</main>
</div>
</body>
</html>
