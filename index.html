---
layout: default
---

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formation Entretien Ménager</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #2c3e50;
      text-align: center;
    }
    .intro {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }
    .video-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .video-card h3 {
      color: #2c3e50;
      margin-top: 0;
    }
    video {
      width: 100%;
      border-radius: 4px;
      background: #000;
    }
  </style>
</head>
<body>

  <h1>🧹 Formation Entretien Ménager</h1>
  <p class="intro">Shorts vidéos concernant entretien ménager</p>

  <div class="galeria">
    {% for video in site.data.videos %}
      <div class="video-card">
        <h3>{{ video.titulo }}</h3>
        <video controls preload="metadata">
          <source src="{{ video.archivo }}" type="video/mp4">
          Votre navigateur ne supporte pas les vidéos HTML5.
        </video>
      </div>
    {% endfor %}
  </div>

</body>
</html>
